name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app
          DEV=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$DEV"
          xcodebuild -version
          xcodebuild -showsdks

      - name: List project targets
        shell: bash
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            > build.log 2>&1
          BUILD_EXIT=$?
          echo "=== XCODEBUILD EXIT CODE: $BUILD_EXIT ==="
          echo ""
          echo "=== FULL BUILD LOG ==="
          cat build.log
          echo ""
          echo "=== FIND .app ==="
          find build -name "*.app" -type d 2>/dev/null || echo "no .app found"
          exit $BUILD_EXIT
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Check build result and package
        shell: bash
        run: |
          APP_PATH=$(find build -name "7T.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "BUILD FAILED — 7T.app not found"
            echo "=== Last 200 lines of build log ==="
            tail -200 build.log
            exit 1
          fi
          echo "BUILD OK — $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r 7T-unsigned.ipa Payload
          ls -lh 7T-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 7T-unsigned-ipa
          path: 7T-unsigned.ipa
          retention-days: 90