name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app
          DEV=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$DEV"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build
        shell: bash
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        shell: bash
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/7T.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: $APP_PATH not found"
            find build/Build/Products -type d -name "*.app" || true
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r 7T-unsigned.ipa Payload
          ls -lh 7T-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7T-unsigned-ipa
          path: 7T-unsigned.ipa
          retention-days: 90